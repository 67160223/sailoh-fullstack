version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sailoh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sailoh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sailoh_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sailoh} # <-- เปลี่ยนจาก sailoh_db เป็น sailoh
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sailoh} -d ${POSTGRES_DB:-sailoh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: sailoh_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sailoh}:${POSTGRES_PASSWORD:-sailoh_secret}@db:5432/${POSTGRES_DB:-sailoh}?schema=public # <-- เปลี่ยนเป็น sailoh
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # ต้องเป็น URL ที่ "เบราว์เซอร์ของผู้ใช้" เรียกได้ ไม่ใช่ URL ภายใน docker network
        # ค่านี้ถูก inline เข้าไปในไฟล์ build ตอน compile (Vite ไม่อ่าน env ตอน runtime)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    container_name: sailoh_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sailoh_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sailoh.com} # <-- เปลี่ยนเป็น .com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secret}
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:
