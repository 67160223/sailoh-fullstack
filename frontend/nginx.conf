server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — path ที่ไม่ใช่ไฟล์จริง (เช่น /route/140, /admin/users) ให้ fallback ไปที่ index.html
    # เพื่อให้ React Router เป็นคนจัดการต่อ ไม่ใช่ nginx ตอบ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache asset ที่มี hash ในชื่อไฟล์ (Vite ใส่ hash มาให้อยู่แล้ว) ได้นานๆ ไม่มีปัญหาเรื่อง cache ค้าง
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
