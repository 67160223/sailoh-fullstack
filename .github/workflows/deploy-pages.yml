# Deploy เฉพาะ frontend ขึ้น GitHub Pages (กดรันเองจากแท็บ Actions)
# ต้องทำก่อน: Settings → Pages → Source = GitHub Actions
# และ Settings → Secrets and variables → Actions → Variables → เพิ่ม VITE_API_URL
#   (เช่น https://your-backend.onrender.com/api/v1) ชี้ไป backend ที่โฮสต์จริง
name: Deploy frontend to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA fallback (รีเฟรชหน้า /plan, /wallet แล้วไม่ 404)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
